postgres {
  url = "jdbc:postgresql://localhost:5432/outbox"
  url = ${?POSTGRES_URL}
  user = "outbox"
  user = ${?POSTGRES_USER}
  password = "outbox"
  password = ${?POSTGRES_PASSWORD}
}
kafkaBootstrap = "localhost:9092"
kafkaBootstrap = ${?KAFKA_BOOTSTRAP}
# names this process in Postgres (application_name) and in traces (service.instance.id), for side-by-side instances
instance = "bench"
instance = ${?INSTANCE_NAME}

db {
  jdbcUrl = ${postgres.url}
  username = ${postgres.user}
  password = ${postgres.password}
  poolName = "bench"
  maxPoolSize = 48
  maxPoolSize = ${?DB_POOL_SIZE}
  dsProperties { ApplicationName = ${instance} }
}

httpServer {
  publicApiHttpPort = 8080
  publicApiHttpPort = ${?HTTP_PORT}
  privateApiHttpPort = 8085
  privateApiHttpPort = ${?METRICS_PORT}
}

tracing {
  exporter {
    endpoint = "http://localhost:4317"
    endpoint = ${?OTLP_ENDPOINT}
  }
  attributes {
    "service.name" = "outbox-bench"
    "service.name" = ${?SERVICE_NAME}
    "service.instance.id" = ${instance}
  }
}

outbox {
  table = ${?OUTBOX_TABLE}
  shards = ${?OUTBOX_SHARDS}
  relay {
    workers = 8
    workers = ${?OUTBOX_RELAY_WORKERS}
    batchSize = 2000
    batchSize = ${?OUTBOX_RELAY_BATCH_SIZE}
    maxTicksPerBatch = ${?OUTBOX_RELAY_MAX_TICKS}
    minTickInterval = ${?OUTBOX_RELAY_MIN_TICK}
    idlePollInterval = ${?OUTBOX_RELAY_IDLE_POLL}
    cursorAnchorInterval = ${?OUTBOX_CURSOR_ANCHOR_INTERVAL}
  }
  partitions {
    xidsPerPartition = ${?OUTBOX_XIDS_PER_PARTITION}
    maintenanceInterval = ${?OUTBOX_MAINTENANCE_INTERVAL}
  }
  kafka.driverProperties {
    "bootstrap.servers" = ${kafkaBootstrap}
    "linger.ms" = 5
    "batch.size" = 262144
    "compression.type" = "lz4"
  }
}

kafka.consumer.orders {
  topics = ["orders"]
  threads = 4
  threads = ${?CONSUMER_THREADS} # 0 = consumer off
  pollTimeout = 100ms
  driverProperties {
    "bootstrap.servers" = ${kafkaBootstrap}
    "group.id" = "outbox-bench"
    "auto.offset.reset" = "earliest"
    "allow.auto.create.topics" = false
    "max.poll.records" = 2000
    "max.poll.records" = ${?CONSUMER_MAX_POLL}
  }
}

bench {
  handler = "kafka"
  handler = ${?BENCH_HANDLER}
  traceRatio = 1.0
  traceRatio = ${?BENCH_TRACE_RATIO}
  handlerDelayMs = 0
  handlerDelayMs = ${?HANDLER_DELAY_MS}
  rollbackPercent = 0
  rollbackPercent = ${?ROLLBACK_PERCENT}
  load {
    rate = 0
    writers = 8
    keys = 10000
    messagesPerTx = 1
    payloadBytes = 300
  }
}

logging.level {
  "root": "WARN"
  "ru.tinkoff.kora": "INFO"
  "io.github.dsudomoin.outbox": "INFO"
}
