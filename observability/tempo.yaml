stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# The defaults (10 000 live traces, 15 MB/s) dropped 70 % of spans at 2 500 sampled tx/s (live_traces_exceeded),
# leaving traces cut in half.
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 100000
      rate_limit_bytes: 50000000
      burst_size_bytes: 60000000

compactor:
  compaction:
    block_retention: 720h # 30 d, same as Prometheus

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
