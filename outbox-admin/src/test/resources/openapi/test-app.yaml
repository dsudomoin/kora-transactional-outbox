openapi: 3.0.3
info:
  title: admin wiring test app
  version: '1'
paths:
  /hello:
    get:
      operationId: hello
      responses:
        '200':
          description: Greeting
          content:
            text/plain:
              schema:
                type: string
  /status:
    get:
      operationId: appStatus
      responses:
        '200':
          description: The app's own status, not the outbox's
          content:
            text/plain:
              schema:
                type: string
  /dead-letters:
    get:
      operationId: appDeadLetters
      responses:
        '200':
          description: The app's own dead letters, not the outbox's
          content:
            text/plain:
              schema:
                type: string
